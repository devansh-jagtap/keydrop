services:
  - type: web
    name: keydrop-api
    env: node
    rootDir: packages/api
    buildCommand: npm install && npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CLERK_ISSUER_URL
        value: https://noble-antelope-0.clerk.accounts.dev
